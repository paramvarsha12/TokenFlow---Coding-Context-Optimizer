
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quotapilot"
version = "0.1.0"
description = "Local AI coding context optimizer"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.0,<2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
quotapilot = "quotapilot.core:main"
quotapilot-mcp = "quotapilot.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
